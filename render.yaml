# Render blueprint for the Trotxi API + Postgres.
#
# One-time setup: render.com → New → Blueprint → connect this repo → Apply.
# Day-to-day deploys are driven by GitHub Actions (.github/workflows/deploy.yml):
# CI green on main → staging deploys automatically → production after a manual
# approval in GitHub. autoDeploy is therefore off — Actions calls the Render API.
databases:
  - name: trotxi-db-staging
    databaseName: trotxi
    user: trotxi
    # Upgraded from free in Aug 2026. The free tier expires ~30 days after
    # creation, which cost us the database once already; this is the paid one.
    # The blueprint must not say `free` here — Render refuses to downgrade a
    # provisioned database, and the whole sync fails on it.
    plan: basic-256mb
    region: frankfurt # closest Render region to Ghana

  # ---- Production database — COMMENTED OUT ----
  # This would be a SECOND paid instance. The database already purchased is the
  # staging one above (upgraded in place), not this. Uncomment only when
  # production is deliberately being paid for.
  #
  # - name: trotxi-db-production
  #   databaseName: trotxi
  #   user: trotxi
  #   plan: basic-256mb
  #   region: frankfurt

# Shared config for the ask-dispatch cron jobs (E3). Kept while the crons
# themselves are commented out: the group costs nothing, and deleting it would
# mean re-entering JWT_SECRET by hand when they are switched on.
#
# The crons mint a short-lived admin token, so this JWT_SECRET MUST equal the web
# service's or every cron gets a 401 that looks like a bug rather than a config
# mismatch. API_BASE_URL is the public staging URL (not a secret).
envVarGroups:
  - name: trotxi-cron-staging
    envVars:
      - key: JWT_SECRET
        sync: false # set in dashboard; MUST match trotxi-api-staging's JWT_SECRET
      - key: API_BASE_URL
        value: https://trotxi-api-staging.onrender.com

services:
  - type: web
    name: trotxi-api-staging
    runtime: docker
    repo: https://github.com/TROTXI/mobility-core
    branch: main
    # Build from the repo root: the pnpm workspace lockfile lives there.
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: false # GitHub Actions triggers deploys after CI passes
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trotxi-db-staging
          property: connectionString
      # Required because NODE_ENV=production (see ADR-0007). Set the value in the
      # Render dashboard; never commit it. Generate: openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      # Firebase service-account key JSON (FCM push, E3). A SECRET → paste the
      # whole JSON as the value in the dashboard, never commit. Unset -> the
      # recording fake sender runs (no real push).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Paystack secret key. Was set in the dashboard but never declared here,
      # so a fresh blueprint apply would have created a service with payments
      # SILENTLY DISABLED — /payments/subscribe returns 503, health checks pass,
      # and nobody finds out until a rider tries to pay. Staging uses the TEST
      # key (sk_test_…); production must use the live one.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Google "Web" OAuth client ID — the audience verified on sign-in. This is
      # PUBLIC (a Web client ID ships in clients; only a client *secret* would be
      # sensitive, and we don't use one), so it lives in the blueprint, not the
      # dashboard. Unset -> POST /auth/google returns 503.
      - key: GOOGLE_CLIENT_ID
        value: 431341307838-pc4m046v2lj18ssfnfl1g52fl5g1cg4q.apps.googleusercontent.com
      # Apple audiences, comma-separated (#168). Also PUBLIC: the iOS bundle id
      # and the Services ID both ship in clients. Native iOS sign-in presents the
      # bundle id and the Android/web flow presents the Services ID, so both are
      # listed once they exist. Unset -> POST /auth/apple returns 503, which is
      # why Google sign-in is unaffected while this is still blank.
      # Waiting on the Apple Developer team + App ID + Services ID (FE lane).
      # - key: APPLE_CLIENT_ID
      #   value: com.trotxi.trotxiCommuter,<Services ID>
      # Sign in with Apple signing key (#213), for the code exchange and the
      # revocation DELETE /me must perform. Team id and key id are public; the
      # .p8 itself is a SECRET, so it is dashboard-managed (sync: false) and
      # never appears here. All three unset -> no exchange, no revocation.
      # - key: APPLE_TEAM_ID
      #   value: <Apple Developer team id>
      # - key: APPLE_KEY_ID
      #   value: <Key ID of the .p8>
      # - key: APPLE_PRIVATE_KEY
      #   sync: false
      # Observability (#28). Set in the dashboard when Grafana Cloud is wired up.
      # METRICS_TOKEN gates GET /metrics (scraper sends it as a bearer token);
      # unset -> /metrics is disabled (404) in production.
      - key: METRICS_TOKEN
        sync: false
      # OpenTelemetry tracing → Grafana Cloud (Tempo) via OTLP/HTTP. Unset ->
      # tracing disabled. OTEL_EXPORTER_OTLP_HEADERS carries the Grafana auth,
      # e.g. "Authorization=Basic <base64 instanceID:token>".
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: trotxi-api
      # Render fronts every service with a load balancer, so the API must be
      # told to read the client's address out of X-Forwarded-For. Unset, all
      # per-IP rate limits (sign-in, refresh, the Paystack webhook) bucket on the
      # balancer instead and every caller shares one counter.
      #
      # An address list, NOT a hop count. Render's balancer reaches us from
      # inside its private network, so trusting private peers trusts it and
      # nothing else: a client connecting directly is public, is not trusted,
      # and cannot forge the header. Fastify 5.12 ignores a numeric value
      # entirely and trusts nobody, so `1` here would silently switch the whole
      # thing off; the API refuses to boot on one rather than let that happen.
      - key: TRUST_PROXY
        value: 'loopback, linklocal, uniquelocal'
      # Browser-client origin allowlist, comma-separated (#174). Unset -> the
      # API reflects any origin, which is fine while no browser client exists.
      # Set in the dashboard to the ops console's origin when trotxi-ops-staging
      # (below) goes live.
      - key: CORS_ORIGINS
        sync: false
      # Cloudflare R2 (avatars, #24) — S3-compatible object storage. The access
      # keys are secrets → set in the dashboard, never commit. All four unset ->
      # in-memory object store (no avatars persisted).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Basemap tiles (#178). PUBLIC by design: the bucket serves anonymous HTTP
      # range requests, which is how PMTiles works — a client reads the index,
      # then asks for exactly the bytes it needs. Nothing secret, so it lives
      # here rather than the dashboard. Unset -> GET /flags reports
      # mapTiles.url = null and clients render without a basemap.
      #
      # Custom domain on Cloudflare, replacing the r2.dev hostname that carried
      # a generated hash and was rate-limited. Clients read this from GET
      # /flags, so this swap was one env var rather than three app releases —
      # which is the whole reason it is served rather than compiled in.
      - key: MAP_TILES_URL
        value: https://tiles.trotxi.com/ghana.pmtiles
      # MapLibre styles for the same bucket (#180). Served through /flags so a
      # restyle is a config change, not three simultaneous app releases.
      - key: MAP_STYLE_URL
        value: https://tiles.trotxi.com/style.light.json
      - key: MAP_STYLE_DARK_URL
        value: https://tiles.trotxi.com/style.dark.json
      # Who a driver calls when something goes wrong (#234). Served on /flags for
      # the same reason the map styles are: depots differ, and a number baked
      # into a shipped build is worse than none. Not secret — it is the number on
      # the side of the van — so it belongs here rather than in the dashboard.
      #
      # Deliberately NOT set to a placeholder. Unset -> /flags reports null and
      # the app hides the control, which is the safe answer; a real-looking
      # number that rings nowhere is the exact failure #234 exists to prevent.
      # Fill these in once operations confirms the line, then redeploy.
      #
      #   - key: OPERATIONS_PHONE
      #     value: '+233XXXXXXXXX'
      #   - key: OPERATIONS_WHATSAPP
      #     value: '+233XXXXXXXXX'
      #   - key: OPERATIONS_HOURS
      #     value: 05:00-22:00 daily

  # ---- Payment recovery cron — READY, NOT YET FUNDED ----
  # One job handles all money-lifecycle recovery in dependency order: durable
  # webhook inbox, Paystack Verify for stale unresolved payments, then atomic
  # period close. The close step skips periods with pending/reserved seats, so
  # it cannot convert rides before boarding/no-show settlement.
  #
  # Render bills cron jobs while they run and applies a $1/month minimum per
  # cron service. Uncomment only after that recurring cost is approved. Until
  # then, POST /admin/payments/maintenance is the identical manual trigger.
  # - type: cron
  #   name: trotxi-payments-maintenance-staging
  #   runtime: docker
  #   repo: https://github.com/TROTXI/mobility-core
  #   branch: main
  #   dockerfilePath: services/api/Dockerfile
  #   dockerContext: .
  #   plan: starter
  #   region: frankfurt
  #   autoDeploy: false
  #   schedule: '15 * * * *' # hourly UTC; webhooks still process immediately
  #   dockerCommand: node dist/cron/payments-maintenance-cron.js
  #   envVars:
  #     - fromGroup: trotxi-cron-staging

  # ---- Ask-dispatch cron jobs (E3) — COMMENTED OUT, see below ----
  #
  # Render has NO FREE TIER for cron jobs: they bill per minute of runtime with
  # a ~$1/month minimum each, on `starter` as the smallest instance. Declared at
  # `plan: free`, an apply fails on all seven — which made the whole blueprint
  # unappliable, and is why staging spent days serving mapTiles.url = null with
  # nobody able to fix it by applying.
  #
  # A blueprint you cannot safely apply is a document, not infrastructure. These
  # stay commented until the ~$7/month is approved; the daily loop can be driven
  # by hand in the meantime via /admin/ask-dispatch, /admin/resolve-defaults and
  # /admin/resolve-no-shows.
  #
  # TO ENABLE: uncomment, change every `plan: free` to `plan: starter`, and
  # apply. Route learning (23:00) has nothing to learn until riders board, so it
  # can stay off longest.
  # Each mints an admin token and POSTs a trigger on the deployed API. Windows are
  # from docs/features/reservations.md; Ghana is UTC (GMT+0) so schedules are plain
  # UTC. autoDeploy off — they redeploy with the API (GitHub Actions / manual).
  # NB: on Render, cron jobs may require a paid instance type; bump `plan` if so.
  # The free web service also sleeps when idle — the first trigger warms it (a
  # slow cold start), which is fine for the pilot.
  # - type: cron
  #   name: trotxi-ask-morning-staging
  #   runtime: docker
  #   repo: https://github.com/TROTXI/mobility-core
  #   branch: main
  #   dockerfilePath: services/api/Dockerfile
  #   dockerContext: .
  #   plan: free
  #   region: frankfurt
  #   autoDeploy: false
  #   schedule: '0 18 * * *' # 18:00 — ask tomorrow-morning riders
  #   dockerCommand: node dist/cron/ask-dispatch-cron.js ask morning
  #   envVars:
  #     - fromGroup: trotxi-cron-staging
  # - type: cron
  #   name: trotxi-resolve-morning-staging
  #   runtime: docker
  #   repo: https://github.com/TROTXI/mobility-core
  #   branch: main
  #   dockerfilePath: services/api/Dockerfile
  #   dockerContext: .
  #   plan: free
  #   region: frankfurt
  #   autoDeploy: false
  #   schedule: '0 21 * * *' # 21:00 cutoff — default-yes the still-pending (morning)
  #   dockerCommand: node dist/cron/ask-dispatch-cron.js resolve morning
  #   envVars:
  #     - fromGroup: trotxi-cron-staging
  # - type: cron
  #   name: trotxi-ask-evening-staging
  #   runtime: docker
  #   repo: https://github.com/TROTXI/mobility-core
  #   branch: main
  #   dockerfilePath: services/api/Dockerfile
  #   dockerContext: .
  #   plan: free
  #   region: frankfurt
  #   autoDeploy: false
  #   schedule: '0 12 * * *' # 12:00 — ask this-evening riders
  #   dockerCommand: node dist/cron/ask-dispatch-cron.js ask evening
  #   envVars:
  #     - fromGroup: trotxi-cron-staging
  # - type: cron
  #   name: trotxi-resolve-evening-staging
  #   runtime: docker
  #   repo: https://github.com/TROTXI/mobility-core
  #   branch: main
  #   dockerfilePath: services/api/Dockerfile
  #   dockerContext: .
  #   plan: free
  #   region: frankfurt
  #   autoDeploy: false
  #   schedule: '0 14 * * *' # 14:00 cutoff — default-yes the still-pending (evening)
  #   dockerCommand: node dist/cron/ask-dispatch-cron.js resolve evening
  #   envVars:
  #     - fromGroup: trotxi-cron-staging
  # # No-show sweeps (E4). These run AFTER the run has departed and debit riders
  # # who confirmed a seat but never boarded — the seat was held for them, so it
  # # costs a ride. They target the day that just happened, not tomorrow.
  # - type: cron
  #   name: trotxi-noshow-morning-staging
  #   runtime: docker
  #   repo: https://github.com/TROTXI/mobility-core
  #   branch: main
  #   dockerfilePath: services/api/Dockerfile
  #   dockerContext: .
  #   plan: free
  #   region: frankfurt
