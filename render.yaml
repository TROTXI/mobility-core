  #   plan: free
  #   region: frankfurt
  #   autoDeploy: false
  #   schedule: '0 23 * * *' # 23:00 — after the evening sweep, before the next day
  #   dockerCommand: node dist/cron/route-learning-cron.js
  #   envVars:
