  #     - key: GOOGLE_CLIENT_ID
  #       value: 431341307838-pc4m046v2lj18ssfnfl1g52fl5g1cg4q.apps.googleusercontent.com
  #     # Unset in production -> /metrics is disabled (404) rather than left open.
