# Render blueprint for the Trotxi API + Postgres.
#
# One-time setup: render.com → New → Blueprint → connect this repo → Apply.
# Day-to-day deploys are driven by GitHub Actions (.github/workflows/deploy.yml):
# CI green on main → staging deploys automatically → production after a manual
# approval in GitHub. autoDeploy is therefore off — Actions calls the Render API.
databases:
  - name: trotxi-db-staging
    databaseName: trotxi
    user: trotxi
    # Upgraded from free in Aug 2026. The free tier expires ~30 days after
    # creation, which cost us the database once already; this is the paid one.
    # The blueprint must not say `free` here — Render refuses to downgrade a
    # provisioned database, and the whole sync fails on it.
    plan: basic-256mb
    region: frankfurt # closest Render region to Ghana

  # ---- Production database — COMMENTED OUT ----
  # This would be a SECOND paid instance. The database already purchased is the
  # staging one above (upgraded in place), not this. Uncomment only when
  # production is deliberately being paid for.
  #
  # - name: trotxi-db-production
  #   databaseName: trotxi
  #   user: trotxi
  #   plan: basic-256mb
  #   region: frankfurt

# Shared config for the ask-dispatch cron jobs (E3). Kept while the crons
# themselves are commented out: the group costs nothing, and deleting it would
# mean re-entering JWT_SECRET by hand when they are switched on.
#
# The crons mint a short-lived admin token, so this JWT_SECRET MUST equal the web
# service's or every cron gets a 401 that looks like a bug rather than a config
# mismatch. API_BASE_URL is the public staging URL (not a secret).
envVarGroups:
  - name: trotxi-cron-staging
    envVars:
      - key: JWT_SECRET
        sync: false # set in dashboard; MUST match trotxi-api-staging's JWT_SECRET
      - key: API_BASE_URL
        value: https://trotxi-api-staging.onrender.com

services:
  - type: web
    name: trotxi-api-staging
    runtime: docker
    repo: https://github.com/TROTXI/mobility-core
    branch: main
    # Build from the repo root: the pnpm workspace lockfile lives there.
    dockerfilePath: services/api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: false # GitHub Actions triggers deploys after CI passes
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trotxi-db-staging
          property: connectionString
      # Required because NODE_ENV=production (see ADR-0007). Set the value in the
      # Render dashboard; never commit it. Generate: openssl rand -base64 48
      - key: JWT_SECRET
        sync: false
      # Firebase service-account key JSON (FCM push, E3). A SECRET → paste the
      # whole JSON as the value in the dashboard, never commit. Unset -> the
      # recording fake sender runs (no real push).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # Paystack secret key. Was set in the dashboard but never declared here,
      # so a fresh blueprint apply would have created a service with payments
      # SILENTLY DISABLED — /payments/subscribe returns 503, health checks pass,
      # and nobody finds out until a rider tries to pay. Staging uses the TEST
      # key (sk_test_…); production must use the live one.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # Google "Web" OAuth client ID — the audience verified on sign-in. This is
      # PUBLIC (a Web client ID ships in clients; only a client *secret* would be
      # sensitive, and we don't use one), so it lives in the blueprint, not the
      # dashboard. Unset -> POST /auth/google returns 503.
      - key: GOOGLE_CLIENT_ID
        value: 431341307838-pc4m046v2lj18ssfnfl1g52fl5g1cg4q.apps.googleusercontent.com
      # Observability (#28). Set in the dashboard when Grafana Cloud is wired up.
      # METRICS_TOKEN gates GET /metrics (scraper sends it as a bearer token);
      # unset -> /metrics is disabled (404) in production.
      - key: METRICS_TOKEN
        sync: false
      # OpenTelemetry tracing → Grafana Cloud (Tempo) via OTLP/HTTP. Unset ->
      # tracing disabled. OTEL_EXPORTER_OTLP_HEADERS carries the Grafana auth,
      # e.g. "Authorization=Basic <base64 instanceID:token>".
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_SERVICE_NAME
        value: trotxi-api
      # Browser-client origin allowlist, comma-separated (#174). Unset -> the
      # API reflects any origin, which is fine while no browser client exists.
      # Set in the dashboard to the ops console's origin when trotxi-ops-staging
      # (below) goes live.
      - key: CORS_ORIGINS
        sync: false
      # Cloudflare R2 (avatars, #24) — S3-compatible object storage. The access
      # keys are secrets → set in the dashboard, never commit. All four unset ->
      # in-memory object store (no avatars persisted).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Basemap tiles (#178). PUBLIC by design: the bucket serves anonymous HTTP
      # range requests, which is how PMTiles works — a client reads the index,
      # then asks for exactly the bytes it needs. Nothing secret, so it lives
      # here rather than the dashboard. Unset -> GET /flags reports
      # mapTiles.url = null and clients render without a basemap.
      #
      # Custom domain on Cloudflare, replacing the r2.dev hostname that carried
      # a generated hash and was rate-limited. Clients read this from GET
      # /flags, so this swap was one env var rather than three app releases —
      # which is the whole reason it is served rather than compiled in.
      - key: MAP_TILES_URL
        value: https://tiles.trotxi.com/ghana.pmtiles

  # ---- Ask-dispatch cron jobs (E3) — COMMENTED OUT, see below ----
  #
  # Render has NO FREE TIER for cron jobs: they bill per minute of runtime with
  # a ~$1/month minimum each, on `starter` as the smallest instance. Declared at
  # `plan: free`, an apply fails on all seven — which made the whole blueprint
  # unappliable, and is why staging spent days serving mapTiles.url = null with
  # nobody able to fix it by applying.
  #
  # A blueprint you cannot safely apply is a document, not infrastructure. These
  # stay commented until the ~$7/month is approved; the daily loop can be driven
  # by hand in the meantime via /admin/ask-dispatch, /admin/resolve-defaults and
  # /admin/resolve-no-shows.
  #
  # TO ENABLE: uncomment, change every `plan: free` to `plan: starter`, and
  # apply. Route learning (23:00) has nothing to learn until riders board, so it
  # can stay off longest.
  # Each mints an admin token and POSTs a trigger on the deployed API. Windows are
  # from docs/features/reservations.md; Ghana is UTC (GMT+0) so schedules are plain
  # UTC. autoDeploy off — they redeploy with the API (GitHub Actions / manual).
  # NB: on Render, cron jobs may require a paid instance type; bump `plan` if so.
  # The free web service also sleeps when idle — the first trigger warms it (a
  # slow cold start), which is fine for the pilot.
