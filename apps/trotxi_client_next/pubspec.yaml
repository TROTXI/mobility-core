name: trotxi_client_next
version: 1.0.0
description: Handwritten client layer over the replacement contract. Sits beside trotxi_client, which serves the deployed API, so an app migrates on its own schedule rather than all at once.
publish_to: none

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  uuid: ^4.5.1
  crypto: ^3.0.7
  flutter_secure_storage: ^10.3.1
  dio: '^5.7.0'
  trotxi_api_client_next:
    path: ../api_client_next
  # Re-exported below. The generated client models a discriminated union as a
  # OneOf, so any caller building one needs the type — and the point of this
  # package is that callers never reach past it for a generated-client detail.
  one_of: '>=1.5.0 <2.0.0'
  flutter:
    sdk: flutter

dev_dependencies:
  test: ^1.24.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  http_mock_adapter: ^0.6.1
