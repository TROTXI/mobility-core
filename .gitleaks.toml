# gitleaks config — extends the default ruleset with an allowlist for
# INTENTIONAL non-secret placeholders: the dev-only JWT fallback (config/env.ts,
# auth/jwt.ts) and test fixtures. See ADR-0007. Real secrets are injected via
# environment variables and are never committed.

[extend]
useDefault = true

[allowlist]
description = "Intentional non-secret placeholders (dev JWT fallback + test fixtures)"
regexes = [
  '''dev-only-insecure-secret-change-me-[0-9a-f]+''',
  '''test-secret-at-least-32-characters-long-[0-9]+''',
  '''a-totally-different-secret-32-chars-min''',
  # Historical synthetic fixture in 1eabdb0, payment-recovery.pg.test.ts:12.
  # Not a Paystack/Stripe account credential. Current tests generate it in memory.
  # Exact value only: do not exempt payment files or real sk_test_* credentials.
  '''^sk_test_disposable012$''',
  # Historical WebAuthn fixture in f56f33b, auth.pg.test.ts:827: base64url of the
  # literal text "authenticator-data". Not key material. Exact value only.
  '''^YXV0aGVudGljYXRvci1kYXRh$''',
]
# No whole-file exceptions, including native Firebase configuration files.

# The same public Firebase client keys now live in the reviewed staging build
# definitions. Limit exceptions to the two detecting rules, these two paths
# and the two public client fields. Other credentials in these files still scan.
[[rules]]
id = "gcp-api-key"
[[rules.allowlists]]
description = "Approved public iOS Firebase client identities"
condition = "AND"
paths = ['''^apps/trotxi_client/lib/approved_firebase_options\.dart$''']
regexTarget = "line"
regexes = ['''^\s*iosApiKey:\s*'AIza[0-9A-Za-z_-]{35}',?\s*$''']
[[rules.allowlists]]
description = "Public Firebase fields in reviewed native and historical app config"
condition = "AND"
paths = ['''^apps/trotxi_(commuter|driver)/(config/staging/google-services\.json|android/app/google-services\.json|lib/firebase_options\.dart)$''']
regexTarget = "line"
regexes = ['''^\s*("current_key":\s*"AIza[0-9A-Za-z_-]{35}"|apiKey:\s*'AIza[0-9A-Za-z_-]{35}'),?\s*$''']
[[rules.allowlists]]
description = "Staging Firebase public mobile client configuration"
condition = "AND"
paths = ['''^apps/trotxi_(commuter|driver)/config/staging\.json$''']
regexTarget = "line"
regexes = ['''^\s*"FIREBASE_(ANDROID|IOS)_API_KEY":\s*"AIza[0-9A-Za-z_-]{35}",?\s*$''']

# The SDK inventory prose is misread as an Auth credential. Cover only the
# exact non-secret phrase at this path, not the whole document or rule.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Approved public iOS Firebase client identities"
condition = "AND"
paths = ['''^apps/trotxi_client/lib/approved_firebase_options\.dart$''']
regexTarget = "line"
regexes = ['''^\s*iosApiKey:\s*'AIza[0-9A-Za-z_-]{35}',?\s*$''']
[[rules.allowlists]]
description = "Public Firebase fields in reviewed native and historical app config"
condition = "AND"
paths = ['''^apps/trotxi_(commuter|driver)/(config/staging/google-services\.json|android/app/google-services\.json|lib/firebase_options\.dart)$''']
regexTarget = "line"
regexes = ['''^\s*("current_key":\s*"AIza[0-9A-Za-z_-]{35}"|apiKey:\s*'AIza[0-9A-Za-z_-]{35}'),?\s*$''']
[[rules.allowlists]]
description = "Mobile SDK inventory prose, including its historical wording"
condition = "AND"
paths = ['''^docs/mobile-release-readiness\.md$''']
regexTarget = "secret"
regexes = ['''^advertising/ATT$''']

# The generic rule also recognizes these fields once the GCP finding is
# excluded. Keep the same field/path boundary rather than disabling the rule.
[[rules.allowlists]]
description = "Staging Firebase public mobile client configuration"
condition = "AND"
paths = ['''^apps/trotxi_(commuter|driver)/config/staging\.json$''']
regexTarget = "line"
regexes = ['''^\s*"FIREBASE_(ANDROID|IOS)_API_KEY":\s*"AIza[0-9A-Za-z_-]{35}",?\s*$''']
