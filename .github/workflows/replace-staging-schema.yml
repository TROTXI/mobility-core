# Installs the replacement schema into the staging database and configures the
# service for it. Manual only. `check` reads and changes nothing; `apply` wipes
# the staging database and cannot be undone.
#
# No credential has to be handed to anyone: the database comes from
# STAGING_DATABASE_URL, the eight keys are generated in the runner, and the
# Paystack and R2 values are read off the service and written back under their
# REPLACEMENT_* names. Every value is masked before it can reach the log.
name: Replace staging schema

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check reads only. apply wipes the staging database.'
        type: choice
        options: [check, apply]
        default: check
      confirm:
        description: 'For apply, type REPLACE. Ignored for check.'
        type: string
        default: ''

concurrency: replace-staging-schema

jobs:
  replace:
    name: ${{ inputs.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
      APPLY: ${{ inputs.mode == 'apply' }}
    steps:
      - name: Refuse an unconfirmed apply
        if: inputs.mode == 'apply' && inputs.confirm != 'REPLACE'
        run: |
          echo '::error::apply requires confirm=REPLACE. Nothing was touched.'
          exit 1

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Read first, and fail here rather than after the database is gone. If the
      # service is missing one of these, an apply would install a schema and
      # then leave the service unable to start.
      - name: Read the values already on the service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$SERVICE_ID" ]; then
            echo '::error::RENDER_STAGING_SERVICE_ID repo variable is not set.'; exit 1
          fi
          page=$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars?limit=100")
          echo "$page" | jq -e 'type == "array"' >/dev/null \
            || { echo '::error::Unexpected response from the Render API.'; exit 1; }
          echo "Service exposes $(echo "$page" | jq 'length') variables."

          missing=0
          copy() { # legacy name -> REPLACEMENT_ name
            value=$(echo "$page" | jq -r --arg k "$1" '.[] | select(.envVar.key == $k) | .envVar.value')
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::$1 is not set on the service. Set it in the dashboard first."
              missing=1; return
            fi
            echo "::add-mask::$value"
            echo "$2=$value" >> "$GITHUB_ENV"
            echo "  ok  $1 -> $2"
          }
          copy PAYSTACK_SECRET_KEY    REPLACEMENT_PAYSTACK_SECRET_KEY
          copy R2_ACCOUNT_ID          REPLACEMENT_R2_ACCOUNT_ID
          copy R2_ACCESS_KEY_ID       REPLACEMENT_R2_ACCESS_KEY_ID
          copy R2_SECRET_ACCESS_KEY   REPLACEMENT_R2_SECRET_ACCESS_KEY
          copy R2_BUCKET              REPLACEMENT_R2_BUCKET_NAME
          [ "$missing" = 0 ] || exit 1

          case "${REPLACEMENT_PAYSTACK_SECRET_KEY:-}" in
            sk_live_*) echo '::warning::The service holds a LIVE Paystack key. api-next refuses it without REPLACEMENT_ALLOW_LIVE_PAYMENTS=yes, so the deploy would fail closed.';;
          esac

      # Always runs, in both modes. This is the "look before leaping" output.
      - name: Show what would be dropped
        working-directory: services/api-next
        env:
          REPLACEMENT_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: node --import tsx scripts/replace-in-place.ts

      - name: Stop here
        if: env.APPLY != 'true'
        run: |
          echo 'check finished. The database and the service are untouched.'
          echo 'Re-run with mode=apply and confirm=REPLACE to carry it out.'

      - name: Wipe and install
        if: env.APPLY == 'true'
        working-directory: services/api-next
        env:
          REPLACEMENT_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REPLACE_IN_PLACE: i-have-read-this
          REPLACEMENT_CONFIG_OUT: ${{ runner.temp }}/replacement.json
        run: node --import tsx scripts/replace-in-place.ts

      - name: Configure the service
        if: env.APPLY == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CONFIG: ${{ runner.temp }}/replacement.json
        run: |
          set_var() {
            curl -fsS -X PUT \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -cn --arg v "$2" '{value: $v}')" \
              "https://api.render.com/v1/services/${SERVICE_ID}/env-vars/$1" >/dev/null
            echo "  set $1"
          }
          # Generated this run: never echoed, only masked and sent.
          for name in $(jq -r 'keys[]' "$CONFIG"); do
            value=$(jq -r --arg k "$name" '.[$k]' "$CONFIG")
            echo "::add-mask::$value"
            set_var "$name" "$value"
          done
          # Copied off the service in the read step.
          set_var REPLACEMENT_PAYSTACK_SECRET_KEY  "$REPLACEMENT_PAYSTACK_SECRET_KEY"
          set_var REPLACEMENT_R2_ACCOUNT_ID        "$REPLACEMENT_R2_ACCOUNT_ID"
          set_var REPLACEMENT_R2_ACCESS_KEY_ID     "$REPLACEMENT_R2_ACCESS_KEY_ID"
          set_var REPLACEMENT_R2_SECRET_ACCESS_KEY "$REPLACEMENT_R2_SECRET_ACCESS_KEY"
          set_var REPLACEMENT_R2_BUCKET_NAME       "$REPLACEMENT_R2_BUCKET_NAME"
          rm -f "$CONFIG"

      - name: What is left to do
        if: env.APPLY == 'true'
        run: |
          echo 'Schema installed and the service configured.'
          echo 'The service still builds services/api. Merge the blueprint change'
          echo 'that points dockerfilePath at services/api-next/Dockerfile, then deploy.'

      - name: Do not leave the config behind on failure
        if: always()
        run: rm -f "${{ runner.temp }}/replacement.json"
