name: Deploy

# Continuous deployment: runs after CI completes on main.
# main (CI green) → replacement migrations → pinned staging deploy → smoke test.
# There is no production environment. This workflow cannot deploy one.
#
# Dormant until the DEPLOY_ENABLED repo variable is "true" (set it after
# connecting the Render blueprint and adding RENDER_API_KEY — see docs/DEPLOY.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Deploys queue rather than cancel: every green commit ships in order.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy staging (Render)
    if: github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The replacement has its own logical database on the existing paid
      # instance. Never fall back to STAGING_DATABASE_URL / the legacy schema.
      - name: Run replacement DB migrations
        env:
          REPLACEMENT_DATABASE_URL: ${{ secrets.STAGING_REPLACEMENT_DATABASE_URL }}
          REPLACEMENT_RUNTIME_ROLE: trotxi_runtime_v1
        run: |
          if [ -z "$REPLACEMENT_DATABASE_URL" ]; then
            echo "::error::STAGING_REPLACEMENT_DATABASE_URL is required. No legacy database fallback."
            exit 1
          fi
          node --input-type=module -e '
            const u = new URL(process.env.REPLACEMENT_DATABASE_URL);
            if (u.pathname !== "/trotxi_replacement" || u.searchParams.get("sslmode") !== "verify-full")
              throw new Error("Replacement database and verified TLS are required");
          '
          pnpm --filter @trotxi/api-next run migrate

      - name: Deploy and wait until live
        run: .github/scripts/render-deploy.sh
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_STAGING_SERVICE_ID }}
          COMMIT_ID: ${{ github.event.workflow_run.head_sha }}

      - name: Smoke test
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          COMMIT_ID: ${{ github.event.workflow_run.head_sha }}
        run: |
          curl -fsS --retry 5 --retry-delay 5 "$STAGING_URL/healthz"
          curl -fsS "$STAGING_URL/readyz"
          curl -fsS "$STAGING_URL/version" | jq -e --arg commit "$COMMIT_ID" '.commit == $commit'
