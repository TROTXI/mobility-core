name: CI

on:
  push:
    branches: [main]
  # Branch filters apply to the PR base. Run stacked PRs too, not only PRs that
  # already target main, so each layer receives the same merge gate.
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# New pushes to the same PR cancel the superseded run; pushes to main always
# run to completion so the history of main stays fully verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml

  postgres-inventory:
    name: PostgreSQL suite inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Require every PostgreSQL suite to be assigned exactly once
        id: inventory
        run: |
          matrix=$(node .github/scripts/postgres-matrix.mjs)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  api-postgres:
    needs: [scope, postgres-inventory]
    if: github.event_name != 'pull_request' || needs.scope.outputs.backend != 'false'
    name: API (Postgres) ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every part runs to the end, so one push shows every failure at once.
      fail-fast: false
      matrix: ${{ fromJSON(needs.postgres-inventory.outputs.matrix) }}
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HARNESS_ADMIN_DATABASE_URL: postgres://harness:harness-ci-only@127.0.0.1:5432/postgres
      HARNESS_ALLOW_CREATE_DATABASES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database suites
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/.harness-artifacts/api
          SUITES: ${{ matrix.files }}
        shell: bash
        run: |
          mkdir -p .harness-artifacts/api
          cd services/api-next
          read -r -a suites <<< "$SUITES"
          node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../../.harness-artifacts/api/tests.xml "${suites[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ matrix.slug == 'financial' && 'financial-foundation-evidence' || format('api-postgres-{0}', matrix.slug) }}
          path: .harness-artifacts/api/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  design-contracts:
    name: Redesign contract (design only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate design source and generated review artifacts
        run: |
          node docs/design/scripts/build-invariants.mjs
          node docs/design/scripts/build-contract.mjs
          node docs/design/scripts/build-transport-contract.mjs
          node --test docs/design/scripts/contract.test.mjs
          node --test .github/scripts/ci-scope.test.mjs
          git diff --exit-code -- docs/design/contracts/target.openapi.json docs/design/contracts/replacement.openapi.json docs/design/contracts/examples.json docs/design/contracts/endpoint-inventory.json docs/design/stage-1-invariants.md docs/design/stage-1-endpoints.md docs/design/stage-2-operation-scope.md services/api-next/src/http/contract.json

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  # A lockfile change with no accompanying manifest change means someone ran a
  # bare `pnpm install` (often on a pnpm version other than the pinned one) and
  # committed a re-resolution. That silently moved @opentelemetry/propagator-jaeger
  # from 2.10.0 back to 2.8.0 on a Flutter-only branch and tripped the security
  # gate. Dependency changes are fine — they just have to come with the manifest
  # edit that justifies them.
  lockfile:
    name: Lockfile guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Lockfile may only change alongside a manifest
        env:
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed" | grep -qx 'pnpm-lock.yaml' || {
            echo "pnpm-lock.yaml unchanged — nothing to check."; exit 0; }

          if echo "$changed" | grep -qE '(^|/)package\.json$|^pnpm-workspace\.yaml$'; then
            echo "Lockfile changed alongside a manifest — expected."; exit 0
          fi

          echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml changed but no package.json or pnpm-workspace.yaml did."
          cat <<'MSG'

          The lockfile was modified without any dependency actually changing.
          This usually means a bare `pnpm install` re-resolved the tree — which
          can silently downgrade transitive packages past our security overrides.

          If you did not mean to change dependencies:

            git checkout origin/main -- pnpm-lock.yaml
            git commit -m "chore: restore pnpm-lock.yaml from main"

          To avoid it next time, use the pinned pnpm and don't re-resolve:

            corepack enable                  # uses the repo's pnpm (packageManager field)
            pnpm install --frozen-lockfile   # install without rewriting the lockfile

          Flutter/app work never needs to touch the Node lockfile.
          MSG
          exit 1

  # Recursive on purpose: every workspace package that defines one of these
  # scripts is gated automatically — a new package (e.g. apps/ops, #170) cannot
  # merge with zero coverage just because nobody edited this file. Packages
  # without a script are skipped (--if-present).
  node:
    name: Node packages (workspace)
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.node != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Ops build checks both TypeScript projects; its lint script repeats them.
      - run: pnpm --filter '!@trotxi/ops' -r --if-present run typecheck
      - run: pnpm --filter '!@trotxi/ops' -r --if-present run lint
      - run: pnpm -r --if-present run test:coverage
      - run: pnpm -r --if-present run build
        env:
          # A compile check, never deployed. Ops refuses to build without an
          # explicit API address, so give it one that cannot reach anything.
          VITE_API_BASE_URL: https://api.example.invalid

  flutter:
    name: Flutter (${{ matrix.app }})
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.mobile != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [trotxi_client, trotxi_commuter, trotxi_driver, trotxi_map, trotxi_diagnostics]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Match the SDK used to validate and package the mobile apps.
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generated API client tests
        if: matrix.app == 'trotxi_client'
        working-directory: apps/api_client
        run: |
          dart pub get
          dart test

  required:
    name: Required core CI
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    needs:
      [scope, postgres-inventory, api-postgres, design-contracts, format, lockfile, node, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require success from the selected PR jobs or the full merge suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            if $event == "merge_group" then
              length > 0 and all(.[]; .result == "success")
            elif $event == "pull_request" then
              {
                "api-postgres": .scope.outputs.backend,
                node: .scope.outputs.node,
                flutter: .scope.outputs.mobile
              } as $selected |
              all($selected[]; . == "true" or . == "false") and
              all(to_entries[];
                .value.result == "success" or
                (.value.result == "skipped" and $selected[.key] == "false"))
            else false end
          ' <<< "$RESULTS"

  financial-required:
    name: Financial foundation (Postgres)
    if: ${{ always() }}
    needs: [scope, postgres-inventory, api-postgres, node]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the shared PostgreSQL and Node jobs for financial coverage
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$GITHUB_EVENT_NAME" '
            .scope.result == "success" and .["postgres-inventory"].result == "success" and
            (if $event == "pull_request" and .scope.outputs.backend == "false" then
              .["api-postgres"].result == "skipped"
             else
              .["api-postgres"].result == "success" and .node.result == "success"
             end)
          ' <<< "$RESULTS"
