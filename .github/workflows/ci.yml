name: CI

on:
  push:
    branches: [main]
  # Branch filters apply to the PR base. Run stacked PRs too, not only PRs that
  # already target main, so each layer receives the same merge gate.
  pull_request:

permissions:
  contents: read

# New pushes to the same PR cancel the superseded run; pushes to main always
# run to completion so the history of main stays fully verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  replacement-transport:
    name: Replacement transport (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HARNESS_ADMIN_DATABASE_URL: postgres://harness:harness-ci-only@127.0.0.1:5432/postgres
      HARNESS_ALLOW_CREATE_DATABASES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Storage and HTTP commands, real contention and attribution negative control
        env:
          REPLACEMENT_EVIDENCE_DIR: ${{ github.workspace }}/.harness-artifacts/transport
        run: |
          mkdir -p .harness-artifacts/transport
          cd services/api-next
          node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../../.harness-artifacts/transport/tests.xml tests/transport.pg.test.ts tests/transport-commands.pg.test.ts tests/catalog.pg.test.ts tests/auth.pg.test.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: replacement-transport-evidence
          path: .harness-artifacts/transport/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  redesign-harness:
    name: Redesign baseline harness (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HARNESS_ADMIN_DATABASE_URL: postgres://harness:harness-ci-only@127.0.0.1:5432/postgres
      HARNESS_ALLOW_CREATE_DATABASES: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: node --test tools/redesign-harness/harness.test.mjs
      - name: Prepare immutable source and locked dependencies
        run: node tools/redesign-harness/prepare.mjs
      - name: Original suite, fixed expectations, contention and negative controls
        run: node --import ./.harness-artifacts/baseline/services/api/node_modules/tsx/dist/loader.mjs tools/redesign-harness/run.mjs --mode=baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: redesign-harness-evidence
          path: |
            .harness-artifacts/latest-report.json
            .harness-artifacts/run-*/**/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  design-contracts:
    name: Redesign contract (design only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate design source and generated review artifacts
        run: |
          node docs/design/scripts/build-invariants.mjs
          node docs/design/scripts/build-contract.mjs
          node docs/design/scripts/build-transport-contract.mjs
          node --test docs/design/scripts/contract.test.mjs
          git diff --exit-code -- docs/design/contracts/target.openapi.json docs/design/contracts/examples.json docs/design/contracts/endpoint-inventory.json docs/design/stage-1-invariants.md docs/design/stage-1-endpoints.md docs/design/stage-2-operation-scope.md services/api-next/src/http/contract.json

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  # A lockfile change with no accompanying manifest change means someone ran a
  # bare `pnpm install` (often on a pnpm version other than the pinned one) and
  # committed a re-resolution. That silently moved @opentelemetry/propagator-jaeger
  # from 2.10.0 back to 2.8.0 on a Flutter-only branch and tripped the security
  # gate. Dependency changes are fine — they just have to come with the manifest
  # edit that justifies them.
  lockfile:
    name: Lockfile guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lockfile may only change alongside a manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed" | grep -qx 'pnpm-lock.yaml' || {
            echo "pnpm-lock.yaml unchanged — nothing to check."; exit 0; }

          if echo "$changed" | grep -qE '(^|/)package\.json$|^pnpm-workspace\.yaml$'; then
            echo "Lockfile changed alongside a manifest — expected."; exit 0
          fi

          echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml changed but no package.json or pnpm-workspace.yaml did."
          cat <<'MSG'

          The lockfile was modified without any dependency actually changing.
          This usually means a bare `pnpm install` re-resolved the tree — which
          can silently downgrade transitive packages past our security overrides.

          If you did not mean to change dependencies:

            git checkout origin/main -- pnpm-lock.yaml
            git commit -m "chore: restore pnpm-lock.yaml from main"

          To avoid it next time, use the pinned pnpm and don't re-resolve:

            corepack enable                  # uses the repo's pnpm (packageManager field)
            pnpm install --frozen-lockfile   # install without rewriting the lockfile

          Flutter/app work never needs to touch the Node lockfile.
          MSG
          exit 1

  # Recursive on purpose: every workspace package that defines one of these
  # scripts is gated automatically — a new package (e.g. apps/ops, #170) cannot
  # merge with zero coverage just because nobody edited this file. Packages
  # without a script are skipped (--if-present); Playwright stays in the e2e
  # job because @trotxi/e2e's `test` needs the Postgres service container.
  node:
    name: Node packages (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test:coverage
      - run: pnpm -r --if-present run build

  migrations:
    name: Migrations (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trotxi
          POSTGRES_PASSWORD: trotxi
          POSTGRES_DB: trotxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trotxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://trotxi:trotxi@localhost:5432/trotxi
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Ordering guard (#184): migrate.ts sorts on the full filename, so two
      # migrations sharing a number run in alphabetical order of their
      # description. Catch that before it silently decides a dependency.
      - run: services/api/scripts/check-migration-prefixes.sh
      - run: pnpm --filter @trotxi/api run migrate
      # Idempotency: a second run must be a clean no-op.
      - run: pnpm --filter @trotxi/api run migrate
      # The payment unit of work relies on real row/advisory locks. These races
      # cannot be proven by the single-process in-memory adapter.
      - run: pnpm --filter @trotxi/api exec vitest run tests/payment-lifecycle.pg.test.ts tests/trip-progress.pg.test.ts tests/trip-position.pg.test.ts tests/commute.pg.test.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres so the suite exercises the Pg adapters end-to-end; the e2e
    # globalSetup migrates + seeds it. Specs self-skip the DB-backed cases when
    # DATABASE_URL is unset (local zero-infra runs).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trotxi
          POSTGRES_PASSWORD: trotxi
          POSTGRES_DB: trotxi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trotxi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://trotxi:trotxi@localhost:5432/trotxi
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trotxi/e2e test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  #Flutter jobs activate when the first app lands in apps/ — see apps/README.md.
  flutter:
    name: Flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [trotxi_client, trotxi_commuter, trotxi_driver]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
