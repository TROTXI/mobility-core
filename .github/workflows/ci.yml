name: CI

on:
  push:
    branches: [main]
  # Branch filters apply to the PR base. Run stacked PRs too, not only PRs that
  # already target main, so each layer receives the same merge gate.
  pull_request:

permissions:
  contents: read

# New pushes to the same PR cancel the superseded run; pushes to main always
# run to completion so the history of main stays fully verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-postgres:
    # The API's database suites, split three ways by their measured run time
    # (about 150s of test work each) so a failure shows in about a minute rather
    # than after the whole set. A new .pg.test.ts file needs adding to one part.
    name: API (Postgres) ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Every part runs to the end, so one push shows every failure at once.
      fail-fast: false
      matrix:
        include:
          - part: 1 of 3
            slug: part-1
            files: >-
              tests/assembly.pg.test.ts tests/gps.pg.test.ts tests/config.pg.test.ts
              tests/pricing.pg.test.ts tests/overview.pg.test.ts tests/riders.pg.test.ts
              tests/operations.pg.test.ts tests/payment-foundation.pg.test.ts
              tests/refund-initiation.pg.test.ts tests/trip-generation.pg.test.ts
          - part: 2 of 3
            slug: part-2
            files: >-
              tests/transport-commands.pg.test.ts tests/driver-credentials.pg.test.ts
              tests/catalog.pg.test.ts tests/fleet.pg.test.ts
              tests/account-recovery.pg.test.ts tests/email.pg.test.ts tests/boarding.pg.test.ts
              tests/payment-recovery.pg.test.ts
          - part: 3 of 3
            slug: part-3
            files: >-
              tests/transport.pg.test.ts tests/auth.pg.test.ts tests/account.pg.test.ts
              tests/trips.pg.test.ts tests/personal-pauses.pg.test.ts tests/push.pg.test.ts
              tests/membership.pg.test.ts
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HARNESS_ADMIN_DATABASE_URL: postgres://harness:harness-ci-only@127.0.0.1:5432/postgres
      HARNESS_ALLOW_CREATE_DATABASES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database suites
        env:
          REPLACEMENT_EVIDENCE_DIR: ${{ github.workspace }}/.harness-artifacts/api
        run: |
          mkdir -p .harness-artifacts/api
          cd services/api-next
          node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../../.harness-artifacts/api/tests.xml ${{ matrix.files }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-postgres-${{ matrix.slug }}
          path: .harness-artifacts/api/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  design-contracts:
    name: Redesign contract (design only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate design source and generated review artifacts
        run: |
          node docs/design/scripts/build-invariants.mjs
          node docs/design/scripts/build-contract.mjs
          node docs/design/scripts/build-transport-contract.mjs
          node --test docs/design/scripts/contract.test.mjs
          git diff --exit-code -- docs/design/contracts/target.openapi.json docs/design/contracts/replacement.openapi.json docs/design/contracts/examples.json docs/design/contracts/endpoint-inventory.json docs/design/stage-1-invariants.md docs/design/stage-1-endpoints.md docs/design/stage-2-operation-scope.md services/api-next/src/http/contract.json

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  # A lockfile change with no accompanying manifest change means someone ran a
  # bare `pnpm install` (often on a pnpm version other than the pinned one) and
  # committed a re-resolution. That silently moved @opentelemetry/propagator-jaeger
  # from 2.10.0 back to 2.8.0 on a Flutter-only branch and tripped the security
  # gate. Dependency changes are fine — they just have to come with the manifest
  # edit that justifies them.
  lockfile:
    name: Lockfile guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lockfile may only change alongside a manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed" | grep -qx 'pnpm-lock.yaml' || {
            echo "pnpm-lock.yaml unchanged — nothing to check."; exit 0; }

          if echo "$changed" | grep -qE '(^|/)package\.json$|^pnpm-workspace\.yaml$'; then
            echo "Lockfile changed alongside a manifest — expected."; exit 0
          fi

          echo "::error file=pnpm-lock.yaml::pnpm-lock.yaml changed but no package.json or pnpm-workspace.yaml did."
          cat <<'MSG'

          The lockfile was modified without any dependency actually changing.
          This usually means a bare `pnpm install` re-resolved the tree — which
          can silently downgrade transitive packages past our security overrides.

          If you did not mean to change dependencies:

            git checkout origin/main -- pnpm-lock.yaml
            git commit -m "chore: restore pnpm-lock.yaml from main"

          To avoid it next time, use the pinned pnpm and don't re-resolve:

            corepack enable                  # uses the repo's pnpm (packageManager field)
            pnpm install --frozen-lockfile   # install without rewriting the lockfile

          Flutter/app work never needs to touch the Node lockfile.
          MSG
          exit 1

  # Recursive on purpose: every workspace package that defines one of these
  # scripts is gated automatically — a new package (e.g. apps/ops, #170) cannot
  # merge with zero coverage just because nobody edited this file. Packages
  # without a script are skipped (--if-present).
  node:
    name: Node packages (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test:coverage
      - run: pnpm -r --if-present run build

  flutter:
    name: Flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [trotxi_client, trotxi_commuter, trotxi_driver, trotxi_map]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Rider API client serialization
        if: matrix.app == 'trotxi_client'
        working-directory: apps/api_client
        run: |
          dart pub get
          dart test test/rider_services_serialization_test.dart test/reservation_detail_serialization_test.dart
