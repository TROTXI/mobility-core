name: Security

on:
  push:
    branches: [main]
  # Integration/stacked PRs need the same security gate as PRs targeting main.
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC — catch newly-disclosed issues

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so secrets in past commits are caught
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1

  # The analysis is free; publishing it is not. Uploading SARIF to the
  # code-scanning API needs GitHub Advanced Security, a paid add-on on a private
  # repo, and every run since 2026-09-02 failed on exactly that step with
  # "Advanced Security must be enabled for this repository to use code scanning"
  # after the queries had already run clean. So we keep the scan and gate on the
  # SARIF ourselves instead of throwing the result away.
  #
  # When Advanced Security is switched on: drop `upload`/`output` and the two
  # steps below. The hosted version tracks findings across commits and remembers
  # dismissals, which a text gate cannot do.
  codeql:
    name: CodeQL (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          upload: never
          output: sarif-results
      # Same bar as the dependency audit below: CVSS 7.0 and up blocks a merge,
      # anything lower is reported in the job summary and kept in the artifact.
      - name: Gate on high-severity findings
        run: python3 .github/scripts/codeql-gate.py sarif-results
      # Always, so a red gate leaves the full report behind to look at rather
      # than just the lines it printed.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-sarif
          path: sarif-results/
          retention-days: 14

  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate on what we SHIP (production deps). Dev-tooling advisories (vitest,
      # vite, esbuild dev servers we never run in CI/prod) are handled by
      # Dependabot PRs instead of blocking every merge.
      - run: pnpm audit --prod --audit-level=high
